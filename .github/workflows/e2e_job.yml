name: E2E Job

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  prepare_database:
    name: Prepare Database
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Prepare Database
        run: echo "No dedicated database configured. Skipping database setup."

  prepare_frontend:
    name: Prepare Frontend (analog frontend_job.yml)
    uses: ./.github/workflows/frontend_job.yml

  run_e2e_tests:
    name: Run E2e-Tests
    runs-on: ubuntu-latest
    needs:
      - prepare_database
      - prepare_frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: frontend

      - name: Prepare Frontend (analog frontend_job.yml)
        run: |
          npm run format-check --if-present
          npm run lint-check --if-present
          npm run test --if-present
          npm run build
        working-directory: frontend

      - name: Start Frontend
        run: npm run preview -- --host 127.0.0.1 --port 4173 &
        working-directory: frontend

      - name: Wait until Ready
        shell: bash
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              echo "Frontend is ready."
              exit 0
            fi
            sleep 2
          done
          echo "Frontend did not become ready in time."
          exit 1

      - name: Run E2e-Tests
        run: npm run test:wikipedia
        working-directory: frontend
