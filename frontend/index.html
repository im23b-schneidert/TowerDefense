<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tower Defense Starter</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Tower Defense - Map Prototype</h1>
      <section class="game-shell">
        <div class="shop" id="shop">
          <p class="shop-title">Build Menu</p>
          <button
            id="basicTowerButton"
            class="shop-button"
            data-tower-type="basic"
            type="button"
            aria-pressed="false"
          >
            Basic Tower (50g)
          </button>
          <button
            id="machineGunTowerButton"
            class="shop-button"
            data-tower-type="machineGun"
            type="button"
            aria-pressed="false"
          >
            Machine Gun Tower (40g)
          </button>
          <button
            id="sniperTowerButton"
            class="shop-button"
            data-tower-type="sniper"
            type="button"
            aria-pressed="false"
          >
            Sniper Tower (120g)
          </button>
          <button
            id="cannonTowerButton"
            class="shop-button"
            data-tower-type="cannon"
            type="button"
            aria-pressed="false"
          >
            Cannon Tower (75g)
          </button>
        </div>

        <div class="canvas-wrap">
          <canvas id="gameCanvas" aria-label="Tower Defense grid"></canvas>
          <button id="restartButton" class="restart-button" type="button" hidden>
            Restart
          </button>
        </div>
      </section>
      <p class="legend">
        0 = Grass (placeable), 1 = Path, 2 = Water, 3 = Hill (LOS blocker)
      </p>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
